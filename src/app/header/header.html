<div class="header">
    <img [src]="img" alt="Image not found" [width]="200" [height]="50" style="padding-left: 10px;">
    <!-- Event binding topic: clicking the menu button emits a toggle request to the shell. -->
    <button class="nav-btn" (click)="toggleNavBar()">
        <svg ngClass="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16" style="padding: 15px 10px;">
            <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
        </svg>
    </button>

<div class="links">
<a href="http://www.miraclesoft.com/">

</a>

</a>
<a href="http://blog.miraclesoft.com/">
    <img src="https://hubble.miraclesoft.com/assets/B.svg" alt="Error" [width]="30">
</a>
<a href="http://help.miraclesoft.com/">

</div>
<div class="profile">
    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
    </svg>
    <button class="logout-btn" type="button" (click)="logout()">Logout</button>
</div>
</div>
